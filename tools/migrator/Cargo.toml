[package]
name = "patternyard-migrator"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
anyhow = "1.0.102"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
mongodb = "3"
serde = "1"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package]
name = "patternyard-services"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[workspace]
members = ["tools/migrator"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "services"
path = "api/services.rs"

[dependencies]
axum = "0.8"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid", "derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "sensitive-headers", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4"] }
vercel_runtime = { version = "2.4", features = ["axum"] }

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
